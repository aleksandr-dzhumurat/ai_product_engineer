<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1720" viewBox="0 0 1800 1720"><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker><marker id="trigger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/></marker><marker id="release" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e"/></marker></defs><rect width="1800" height="1720" fill="white"/><g font-family="Arial, sans-serif"><rect x="320" y="160" width="1120" height="390" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="320" y="720" width="1120" height="750" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="1480" y="160" width="290" height="1310" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="8 6"/><text x="40" y="59.0" font-size="34" fill="#243247">MLOps: от исследования к production</text><text x="40" y="96.0" font-size="18" fill="#243247">Данные слева · исследование сверху · управляемые пайплайны и сервис снизу · общие инструменты справа</text><text x="345" y="202.0" font-size="25" fill="#1971c2">RESEARCH / ИССЛЕДОВАНИЕ</text><text x="345" y="233.0" font-size="18" fill="#243247">Интерактивные эксперименты. Результат — проверенная гипотеза и код пайплайна.</text><text x="345" y="762.0" font-size="25" fill="#2b8a3e">PRODUCTION / УПРАВЛЯЕМАЯ ЭКСПЛУАТАЦИЯ</text><text x="345" y="793.0" font-size="18" fill="#243247">Повторяемое обучение → проверенный кандидат → контролируемый выпуск → наблюдение</text><text x="1500" y="200.0" font-size="20" fill="#1971c2">ОБЩИЕ ИНСТРУМЕНТЫ</text><text x="40" y="201.0" font-size="23" fill="#e8590c">СЛОИ ДАННЫХ</text><rect x="40" y="245" width="235" height="75" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" /><text x="54" y="274.0" font-size="17" fill="#e8590c">Raw data</text><text x="54" y="296.1" font-size="17" fill="#e8590c">События, логи,</text><text x="54" y="318.2" font-size="17" fill="#e8590c">сообщения</text><rect x="40" y="365" width="235" height="75" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" /><text x="54" y="394.0" font-size="17" fill="#e8590c">Curated data</text><text x="54" y="416.1" font-size="17" fill="#e8590c">Очистка, дедупликация</text><rect x="40" y="485" width="235" height="75" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" /><text x="54" y="516.0" font-size="19" fill="#e8590c">Расчёт признаков</text><text x="54" y="540.7" font-size="19" fill="#e8590c">Версионируемый код</text><rect x="40" y="610" width="235" height="85" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" /><text x="54" y="641.0" font-size="19" fill="#e8590c">Feature Store /</text><text x="54" y="665.7" font-size="19" fill="#e8590c">версионные признаки</text><text x="45" y="725.0" font-size="15" fill="#6b7280">Feature Store — вариант</text><text x="45" y="744.5" font-size="15" fill="#6b7280">реализации, не обязательное</text><text x="45" y="764.0" font-size="15" fill="#6b7280">условие для старта.</text><polyline points="157,320 157,365" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="157,440 157,485" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="157,560 157,610" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><rect x="355" y="270" width="230" height="85" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="369" y="301.0" font-size="19" fill="#1971c2">Jupyter / ноутбук</text><text x="369" y="325.7" font-size="19" fill="#1971c2">EDA, анализ ошибок</text><rect x="650" y="270" width="255" height="85" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="664" y="299.0" font-size="17" fill="#1971c2">Compute по запросу</text><text x="664" y="321.1" font-size="17" fill="#1971c2">CPU / GPU</text><text x="664" y="343.2" font-size="17" fill="#1971c2">Spark / Dask</text><polyline points="585,308 650,308" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><polyline points="275,280 355,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="275,400 302,400 302,335 355,335" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><rect x="355" y="425" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="369" y="456.0" font-size="19" fill="#7950b8">Выбор данных</text><text x="369" y="480.7" font-size="19" fill="#7950b8">и версии</text><rect x="570" y="425" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="584" y="456.0" font-size="19" fill="#7950b8">Подготовка</text><text x="584" y="480.7" font-size="19" fill="#7950b8">признаков</text><rect x="785" y="425" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="799" y="456.0" font-size="19" fill="#7950b8">Обучение</text><text x="799" y="480.7" font-size="19" fill="#7950b8">модели</text><rect x="1000" y="425" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="1014" y="456.0" font-size="19" fill="#7950b8">Оценка</text><text x="1014" y="480.7" font-size="19" fill="#7950b8">метрик</text><rect x="1215" y="425" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="1229" y="456.0" font-size="19" fill="#7950b8">Валидация</text><text x="1229" y="480.7" font-size="19" fill="#7950b8">гипотезы</text><polyline points="545,464 570,464" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="760,464 785,464" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="975,464 1000,464" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="1190,464 1215,464" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="470,355 470,425" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><polyline points="275,650 310,650 310,464 355,464" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><rect x="355" y="585" width="320" height="85" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="369" y="616.0" font-size="19" fill="#1971c2">Git + Pull Request</text><text x="369" y="640.7" font-size="19" fill="#1971c2">Код, конфигурация, тесты</text><rect x="790" y="585" width="320" height="85" rx="12" fill="#fff9db" stroke="#b7791f" stroke-width="1.5" /><text x="804" y="616.0" font-size="19" fill="#b7791f">CI: тесты + code review</text><text x="804" y="640.7" font-size="19" fill="#b7791f">Сборка версии пайплайна</text><polyline points="1310,503 1310,570 515,570 515,585" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><polyline points="675,627 790,627" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><text x="693" y="613.0" font-size="15" fill="#1971c2">проверка</text><polyline points="950,670 950,825" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><text x="967" y="721.0" font-size="15" fill="#1971c2">принятая версия кода</text><text x="355" y="698.0" font-size="17" fill="#1971c2">В production переносится код и конфигурация. Состояние ноутбука не переносится.</text><rect x="355" y="825" width="1050" height="82" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="369" y="856.0" font-size="19" fill="#1971c2">Оркестратор: Airflow / Kubeflow / аналог</text><text x="369" y="880.7" font-size="19" fill="#1971c2">Расписание · новые данные · ручной запуск · повторы · логи</text><rect x="355" y="960" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="369" y="991.0" font-size="19" fill="#7950b8">Версия данных</text><text x="369" y="1015.7" font-size="19" fill="#7950b8">+ проверки</text><rect x="570" y="960" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="584" y="991.0" font-size="19" fill="#7950b8">Подготовка</text><text x="584" y="1015.7" font-size="19" fill="#7950b8">признаков</text><rect x="785" y="960" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="799" y="991.0" font-size="19" fill="#7950b8">Обучение</text><text x="799" y="1015.7" font-size="19" fill="#7950b8">в фикс. среде</text><rect x="1000" y="960" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="1014" y="991.0" font-size="19" fill="#7950b8">Оценка</text><text x="1014" y="1015.7" font-size="19" fill="#7950b8">на holdout</text><rect x="1215" y="960" width="190" height="78" rx="12" fill="#f3f0ff" stroke="#7950b8" stroke-width="1.5" /><text x="1229" y="991.0" font-size="19" fill="#7950b8">Порог качества</text><text x="1229" y="1015.7" font-size="19" fill="#7950b8">и сравнение</text><polyline points="545,999 570,999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="760,999 785,999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="975,999 1000,999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="1190,999 1215,999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="470,907 470,960" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><polyline points="275,665 294,665 294,999 355,999" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><rect x="1215" y="1090" width="190" height="85" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1229" y="1121.0" font-size="19" fill="#1971c2">Model Registry</text><text x="1229" y="1145.7" font-size="19" fill="#1971c2">Версия-кандидат</text><polyline points="1310,1038 1310,1090" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><text x="1120" y="1065.0" font-size="15" fill="#2b8a3e">прошла проверки</text><rect x="930" y="1090" width="235" height="85" rx="12" fill="#fff9db" stroke="#b7791f" stroke-width="1.5" /><text x="944" y="1119.0" font-size="17" fill="#b7791f">Staging</text><text x="944" y="1141.1" font-size="17" fill="#b7791f">API, нагрузка,</text><text x="944" y="1163.2" font-size="17" fill="#b7791f">интеграция</text><rect x="650" y="1090" width="230" height="85" rx="12" fill="#fff9db" stroke="#b7791f" stroke-width="1.5" /><text x="664" y="1119.0" font-size="17" fill="#b7791f">Решение о выпуске</text><text x="664" y="1141.1" font-size="17" fill="#b7791f">Правила /</text><text x="664" y="1163.2" font-size="17" fill="#b7791f">согласование</text><rect x="355" y="1090" width="245" height="85" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" /><text x="369" y="1119.0" font-size="17" fill="#2b8a3e">Развёртывание</text><text x="369" y="1141.1" font-size="17" fill="#2b8a3e">Canary / A/B</text><text x="369" y="1163.2" font-size="17" fill="#2b8a3e">при необходимости</text><polyline points="1215,1132 1165,1132" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><polyline points="930,1132 880,1132" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><polyline points="650,1132 600,1132" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><rect x="355" y="1260" width="245" height="85" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" /><text x="369" y="1290.0" font-size="18" fill="#2b8a3e">Inference-сервис</text><text x="369" y="1313.4" font-size="18" fill="#2b8a3e">Активная версия</text><rect x="670" y="1260" width="230" height="85" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" /><text x="684" y="1291.0" font-size="19" fill="#2b8a3e">Приложение</text><text x="684" y="1315.7" font-size="19" fill="#2b8a3e">Запросы и ответы</text><rect x="980" y="1260" width="425" height="85" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="994" y="1291.0" font-size="19" fill="#1971c2">Мониторинг и обратная связь</text><text x="994" y="1315.7" font-size="19" fill="#1971c2">Ошибки · задержки · качество · дрейф</text><polyline points="477,1175 477,1260" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><polyline points="600,1302 670,1302" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="900,1302 980,1302" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><polyline points="785,1260 785,1220 550,1220 550,1260" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><text x="670" y="1205.0" font-size="15" fill="#495057">запрос</text><text x="605" y="1324.0" font-size="14" fill="#495057">ответ</text><polyline points="157,695 157,1225 410,1225 410,1260" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><text x="45" y="1200.0" font-size="15" fill="#495057">признаки для inference</text><polyline points="1190,1345 1190,1515 15,1515 15,280 40,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><text x="400" y="1495.0" font-size="15" fill="#495057">события и новые метки → в данные следующего цикла</text><text x="355" y="1397.0" font-size="17" fill="#2b8a3e">Не прошла проверка → выпуск блокируется; текущая модель продолжает работать.</text><text x="355" y="1427.0" font-size="17" fill="#2b8a3e">Проблема после выпуска → откат на предыдущую сохранённую версию.</text><rect x="1500" y="260" width="250" height="110" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1514" y="288.0" font-size="16" fill="#1971c2">Experiment Tracking</text><text x="1514" y="308.8" font-size="16" fill="#1971c2">MLflow / аналог</text><text x="1514" y="329.6" font-size="16" fill="#1971c2">Метрики и артефакты</text><text x="1500" y="407.0" font-size="17" fill="#243247">Общий tracking для</text><text x="1500" y="429.1" font-size="17" fill="#243247">research и production.</text><text x="1500" y="451.2" font-size="17" fill="#243247">У каждого запуска свой ID.</text><polyline points="1405,465 1457,465 1457,315 1500,315" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><polyline points="1405,999 1457,999 1457,345 1500,345" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><rect x="1500" y="540" width="250" height="110" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1514" y="568.0" font-size="16" fill="#1971c2">Artifact / Image Registry</text><text x="1514" y="588.8" font-size="16" fill="#1971c2">Версии моделей, датасетов</text><text x="1514" y="609.6" font-size="16" fill="#1971c2">и Docker-образов</text><rect x="1500" y="740" width="250" height="110" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1514" y="769.0" font-size="17" fill="#1971c2">Окружения и доступы</text><text x="1514" y="791.1" font-size="17" fill="#1971c2">Docker · зависимости</text><text x="1514" y="813.2" font-size="17" fill="#1971c2">CPU / GPU · секреты</text><rect x="1500" y="940" width="250" height="110" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1514" y="969.0" font-size="17" fill="#1971c2">Наблюдаемость</text><text x="1514" y="991.1" font-size="17" fill="#1971c2">Логи · метрики · алерты</text><text x="1514" y="1013.2" font-size="17" fill="#1971c2">Runbook и дежурство</text><rect x="1500" y="1150" width="250" height="110" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5" /><text x="1514" y="1178.0" font-size="16" fill="#1971c2">Происхождение выпуска</text><text x="1514" y="1198.8" font-size="16" fill="#1971c2">Код, данные, конфигурация,</text><text x="1514" y="1219.6" font-size="16" fill="#1971c2">модель и образ сервиса</text><text x="1500" y="1318.0" font-size="18" fill="#1971c2">MLOps обеспечивает</text><text x="1500" y="1341.4" font-size="18" fill="#1971c2">связность и надёжность</text><text x="1500" y="1364.8" font-size="18" fill="#1971c2">всего процесса.</text><polyline points="50,1580 130,1580" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#data)" /><text x="145" y="1582.0" font-size="17" fill="#243247">Данные / результаты</text><polyline points="420,1580 500,1580" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#trigger)" stroke-dasharray="7 6"/><text x="515" y="1582.0" font-size="17" fill="#243247">Запуск / управление / запись результатов</text><polyline points="1000,1580 1080,1580" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#release)" /><text x="1095" y="1582.0" font-size="17" fill="#243247">Продвижение модели / выпуск</text><text x="40" y="1646.0" font-size="16" fill="#6b7280">Адаптация схемы Efficient Machine Learning Experimentation Environments (Aurimas Griciūnas).</text><text x="40" y="1674.0" font-size="16" fill="#6b7280">Research и production разделены по режиму работы; обучение в production не означает немедленный выпуск модели.</text></g></svg>